<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play an endless live set, generated in your browser with SuperCollider.">
  <meta name="theme-color" content="#0a0e10">
  <title>Infinite DJ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e10'/%3E%3Ctext x='9' y='46' font-size='48' fill='%239aeaff'%3E∞%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="listen">
    <header class="title">
      <p class="eyebrow">Live generative music</p>
      <h1>Infinite DJ</h1>
    </header>
    <img class="deck-art" src="assets/infinite-dj-banner.webp" alt="" fetchpriority="high" width="2172" height="724">
    <section class="player" aria-label="Infinite DJ controls">
      <div class="transport">
        <button class="play" id="play" type="button" disabled><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">Play</span></button>
        <label class="channel" for="channel">Channel
          <select id="channel">
            <option value="edm">EDM</option>
            <option value="pop">Pop</option>
            <option value="soundscape">Soundscape</option>
            <option value="rock">Rock</option>
          </select>
        </label>
        <button id="next" type="button" disabled>Next</button>
      </div>
      <label class="energy" for="energy">Energy<input id="energy" type="range" min="0" max="100" value="38"></label>
      <p id="status" class="status" role="status">Preparing local audio…</p>
      <noscript>Enable JavaScript to play Infinite DJ.</noscript>
    </section>
  </main>
  <footer>
    <span>Generated in your browser with SuperCollider.</span>
    <span><a href="../" data-repo-path="">GitHub source ↗</a><a href="../infinite/README.md" data-repo-path="infinite/README.md">Desktop guide ↗</a><a href="runtime/SOURCE.txt">Web runtime source ↗</a></span>
  </footer>
</body>
</html>
